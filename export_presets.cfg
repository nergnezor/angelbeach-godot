name="Web"
platform="Web"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="reference/*"
export_path="build/web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
; REQUIRED for a GDExtension project. Without it the export omits the wasm
; side of the extension and the game boots to a scene whose classes are all
; unknown -- MotionPlan, BallSim, Contact and GestureSolver all live there.
variant/extensions_support=true
; SharedArrayBuffer, which the threaded build needs. It also means the page
; must be served with COOP/COEP headers; GitHub Pages does not send them, so
; the shell below installs a service worker that adds them.
variant/thread_support=true
vram_texture_compression/for_desktop=true
; for_mobile is on because import_etc2_astc is on (Android export refuses
; to run without it — EditorExportPlatformAndroid::has_valid_project_configuration
; returns valid=false). An earlier revision left this false: at that point
; the project setting was off, and Godot's web exporter then failed with an
; EMPTY error list (should_import_etc2_astc() with no r_error write). The
; setting is now required for the Android preset, so the web build can ship
; the mobile formats too and a phone browser is no longer on desktop-only
; textures.
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
; Stop the browser eating the stick as a scroll/pinch. Godot's own shell
; focuses the canvas; this is the CSS half that the shell does not set.
html/head_include="<style>html,body,#canvas{touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none}</style>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=true
progressive_web_app/ensure_cross_origin_isolation_headers=true
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=1
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0, 0, 0, 1)

