[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="reference/*"
export_path="build/web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
; REQUIRED for a GDExtension project. Without it the export omits the wasm
; side of the extension and the game boots to a scene whose classes are all
; unknown -- MotionPlan, BallSim, Contact and GestureSolver all live there.
variant/extensions_support=true
; SharedArrayBuffer, which the threaded build needs. It also means the page
; must be served with COOP/COEP headers; GitHub Pages does not send them, so
; the shell below installs a service worker that adds them.
variant/thread_support=true
vram_texture_compression/for_desktop=true
; NOT for_mobile: this build targets desktop browsers, and turning it on
; silently failed the export with an EMPTY error list. Godot's own
; EditorExportPlatformWeb::has_valid_project_configuration() checks
; should_import_etc2_astc() when this is true, and returns valid=false
; without ever writing to r_error when that project setting (a separate
; thing from this checkbox: Project Settings > rendering/textures/
; vram_compression/import_etc2_astc) is off -- which it is, since nothing
; here imports for mobile. Traced by reading editor_export_platform.cpp
; and platform/web/export/export_plugin.cpp after the headless CLI export
; printed "due to configuration errors:" followed by nothing.
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=true
progressive_web_app/ensure_cross_origin_isolation_headers=true
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0, 0, 0, 1)
