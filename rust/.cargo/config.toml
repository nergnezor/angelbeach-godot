# wasm32-unknown-emscripten only -- inert for the native x86_64 build (Cargo
# only applies a [target.<triple>] section when that triple is the active
# build target).
#
# Reference: github.com/PgBiel/hello-gdext-wasm, the only other known
# gdext-to-wasm build found, with a verified working recipe this mirrors.
#
# SIDE_MODULE=2: a GDExtension is a library Godot's OWN wasm module loads at
# runtime, not a standalone program, so it has to be built as an Emscripten
# side module rather than the default main-module executable.
#
# +atomics and -pthread: Godot's threaded web export templates expect a
# shared WebAssembly.Memory. Without these two, rustc -- and the std/core
# that -Zbuild-std recompiles from source -- emit an ordinary, non-shared
# memory import, which is exactly the failure this was added to fix:
#   LinkError: WebAssembly.instantiate(): Import #102 "env" "memory":
#   mismatch in shared state of memory, declared = 0, imported = 1
# An earlier attempt set CFLAGS/CXXFLAGS=-pthread in the workflow instead;
# that does not reach rustc's own codegen or its link step at all -- it only
# affects C/C++ sources compiled through cc-rs, which this crate has none
# of. -pthread has to arrive as a link arg and +atomics as a codegen
# target-feature, and both have to apply to the std/core build too, which is
# exactly what a target-scoped rustflags (rather than a step-local env var)
# guarantees.
#
# -Cllvm-args=-enable-emscripten-cxx-exceptions=0 alone (what an earlier
# version of this file had) does NOT fix the `Import #83 "env"
# "__cpp_exception": tag import requires a WebAssembly.Tag` LinkError --
# verified directly by inspecting a deployed build's import table with
# wasm-objdump: the tag[0] <env.__cpp_exception> import was present with
# that flag AND, wrongly assumed to be the fix at the time, still present
# after removing it entirely. Neither state matched what Godot's official
# templates (built with plain emcc, JS-based exception lowering, no such
# Tag export) expect. Removing it was based on the reasoning that this
# crate is pure Rust with nothing for a C++-exceptions-specific flag to
# control -- true, but beside the point: Rust's own panic=unwind codegen
# for this target independently decides between the legacy Emscripten
# JS-based lowering and the native wasm-exceptions Tag-based ABI, and that
# decision is NOT what -enable-emscripten-cxx-exceptions controls.
#
# The actual fix, and the two flags actually missing, came from
# godot-rust's own web export docs (godot-rust.github.io/book/toolchain/
# export-web.html), which is the authoritative recipe for this exact
# gdext-to-wasm combination -- more authoritative than the third-party
# hello-gdext-wasm project this file previously cited, which predates
# whatever gdext/rustc version introduced the need for these two:
#   -Z emscripten-wasm-eh=false   -- forces the legacy JS-based lowering,
#     overriding whatever makes Rust default to native wasm exceptions
#     here despite -enable-emscripten-cxx-exceptions=0 also being set.
#   -Z default-visibility=hidden  -- isolates symbols; matters once/if this
#     extension shares a page with other wasm modules, harmless otherwise.
# Re-added -enable-emscripten-cxx-exceptions=0 alongside them since that's
# what godot-rust's own docs pair it with, even though it alone did nothing
# here -- no evidence it's actively harmful, and diverging from the
# documented-working combination without a specific reason is how the
# previous, wrong "just remove it" fix happened.
[target.wasm32-unknown-emscripten]
rustflags = [
    "-C", "link-args=-sSIDE_MODULE=2",
    "-C", "link-args=-pthread",
    "-C", "target-feature=+atomics",
    "-C", "llvm-args=-enable-emscripten-cxx-exceptions=0",
    "-Z", "default-visibility=hidden",
    "-Z", "link-native-libraries=no",
    "-Z", "emscripten-wasm-eh=false",
]
