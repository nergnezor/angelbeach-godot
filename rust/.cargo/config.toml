# wasm32-unknown-emscripten only -- inert for the native x86_64 build (Cargo
# only applies a [target.<triple>] section when that triple is the active
# build target).
#
# Reference: github.com/PgBiel/hello-gdext-wasm, the only other known
# gdext-to-wasm build found, with a verified working recipe this mirrors.
#
# SIDE_MODULE=2: a GDExtension is a library Godot's OWN wasm module loads at
# runtime, not a standalone program, so it has to be built as an Emscripten
# side module rather than the default main-module executable.
#
# +atomics and -pthread: Godot's threaded web export templates expect a
# shared WebAssembly.Memory. Without these two, rustc -- and the std/core
# that -Zbuild-std recompiles from source -- emit an ordinary, non-shared
# memory import, which is exactly the failure this was added to fix:
#   LinkError: WebAssembly.instantiate(): Import #102 "env" "memory":
#   mismatch in shared state of memory, declared = 0, imported = 1
# An earlier attempt set CFLAGS/CXXFLAGS=-pthread in the workflow instead;
# that does not reach rustc's own codegen or its link step at all -- it only
# affects C/C++ sources compiled through cc-rs, which this crate has none
# of. -pthread has to arrive as a link arg and +atomics as a codegen
# target-feature, and both have to apply to the std/core build too, which is
# exactly what a target-scoped rustflags (rather than a step-local env var)
# guarantees.
#
# The `env.__cpp_exception` Tag LinkError (`Import #83 "env"
# "__cpp_exception": tag import requires a WebAssembly.Tag`) took four
# attempts to actually fix. Root cause: Godot 4.7.1's official web export
# templates were built with Emscripten's legacy JS-based exception lowering
# (no Tag export), while newer rustc defaults wasm32-unknown-emscripten to
# the native Wasm-exceptions Tag-based ABI. Every attempt below was checked
# against a deployed build's real import table with wasm-objdump, not just
# green CI -- green CI alone was wrong twice here.
#   1. -Cllvm-args=-enable-emscripten-cxx-exceptions=0 -- inert. It's an LLVM
#      C++-exceptions toggle; this crate has no C++ for it to control. The
#      Tag import was present with and without it.
#   2. -Z emscripten-wasm-eh=false -- this was the correct lever (rustc's own
#      `emscripten_wasm_eh` codegen option, confirmed by reading
#      compiler/rustc_session/src/options.rs), but the project floated on
#      @nightly with no date pin, and by the time CI next ran, the flag had
#      been deleted from rustc outright: `error: unknown unstable option:
#      'emscripten-wasm-eh'`. Per rust-lang/rust#147224, this option
#      defaulted to false (legacy JS, matching Godot's templates) until
#      2025-12-05, then defaulted true, then was removed as an option
#      entirely by some nightly before 2026-08-16.
#   3. -C target-feature=-exception-handling -- also verified NOT to work:
#      disabling the LLVM Wasm target feature does not override rustc's own
#      panic-lowering decision on a nightly where emscripten_wasm_eh is
#      unconditional (per rustc's 1.98.0 release notes: "the WASM exception
#      handling ABI is now unconditionally used" on this target). Deployed
#      and checked with wasm-objdump: the __cpp_exception Tag import was
#      still present.
#   4. Pinning to nightly-2025-11-15 (before the 2025-12-05 default flip, no
#      flag needed) looked like the fix but wasn't verifiable even at the
#      "does it compile" level: godot 0.5.5's own MSRV is rustc 1.94, and
#      the nightly version number doesn't bump from 1.93 to 1.94 until
#      2025-12-06 -- the SAME day as the flip. There is no date where
#      "before the flip" and "meets the MSRV" both hold; pinning by date
#      pre-flip is a dead end for this project specifically.
#   5. Pinning PAST the flip instead, to a nightly new enough for the MSRV,
#      and passing the flag explicitly to restore the legacy default it used
#      to be (see .github/workflows/pages.yml for the exact pinned date and
#      why) DID kill the Tag import -- verified with a real local emsdk
#      4.0.11 build inspected via wasm-objdump: shared memory import
#      present, zero Tag[] entries, no __cpp_exception import anywhere.
#      Deployed, and the ORIGINAL LinkError was gone. But it surfaced a
#      further, different crash: `TypeError: resolved is not a function` at
#      `stubs.<computed>` in index.js, during initRuntime -- reproduced with
#      a fresh (non-cached) Playwright load with COOP/COEP forced via route
#      interception, then pinned down to the exact symbol by patching
#      index.js in-flight to log it: `invoke_i`, the simplest possible
#      signature there is. Godot's own index.js contains the substring
#      "invoke_" ZERO times anywhere -- Godot's official web template has NO
#      JS-based exception-invoke plumbing at all, not even the trivial
#      signature, because Godot's own C++ core does not use C++ exceptions
#      and never needed any. There was never a legacy-JS-ABI to "match" --
#      forcing our side to legacy JS just swapped one kind of missing-import
#      crash (Tag) for another (invoke_*), because Godot's main module can't
#      satisfy either scheme.
#   6. The actual, durable fix: `panic = "abort"`. Godot's own web template
#      needs NO exception-unwinding ABI from a loaded side module because it
#      has none of its own; the fix is for this crate to not need one
#      either, not to guess which ABI to request. This also happens to be
#      the semantically correct choice independent of this whole saga: a
#      Rust panic unwinding across the FFI boundary into Godot's C++ engine
#      is already undefined behavior, on every platform, not just wasm.
#      Matches the resolution godot-rust/gdext#1119 and
#      rust-lang/compiler-team#920 both reference in passing ("resolved
#      using panic=abort") without either spelling out why. `-Zbuild-std`
#      needs to be told explicitly which std components to build for a
#      non-default panic strategy -- see the wasm build step in
#      .github/workflows/pages.yml for `-Zbuild-std=std,panic_abort`.
[target.wasm32-unknown-emscripten]
rustflags = [
    "-C", "link-args=-sSIDE_MODULE=2",
    "-C", "link-args=-pthread",
    "-C", "target-feature=+atomics",
    "-C", "panic=abort",
    "-Z", "default-visibility=hidden",
    "-Z", "link-native-libraries=no",
    "-Z", "emscripten-wasm-eh=false",
]
