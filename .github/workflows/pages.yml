# Web build, deployed to GitHub Pages.
#
# THE ONE THING THAT WILL BREAK THIS: EM_VERSION below must match the Emscripten
# version Godot's own web export templates were built with. A GDExtension is
# linked against those templates, so a mismatch fails at load with the scene's
# classes all unknown rather than with a clear error. Godot pins it in
# .github/workflows/web_builds.yml on the matching release tag -- read it there
# and set it here; do not guess.
name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.1
  # Read from godotengine/godot's own .github/workflows/web_builds.yml at the
  # 4.7.1-stable tag -- it pins 4.0.11, not 4.0.14 (an earlier guess here,
  # made without actually reading that file despite this comment's own
  # instruction to). A mismatched Emscripten build can differ on ABI defaults
  # -- thread/memory model, exception-handling lowering -- from what the
  # official templates were built with, and that is a plausible cause of
  # BOTH LinkErrors hit so far: first a shared-memory import mismatch, then
  # (after fixing that) an exception-tag import mismatch.
  EM_VERSION: 4.0.11
  EMSDK_CACHE_FOLDER: emsdk-cache

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache Emscripten SDK and sysroot build
        # setup-emsdk's own actions-cache-folder handling (below) only saves
        # right after install, before any build runs -- it can't see what
        # emcc writes into EM_CACHE during the wasm build step later. This
        # step wraps the same folder so its post-job save also captures that.
        #
        # The other half of this, and the one that actually matters: setting
        # actions-cache-folder makes setup-emsdk install emsdk at this fixed,
        # repo-relative path instead of its default $RUNNER_TEMP/<random-uuid>
        # one (confirmed by reading setup-emsdk's own dist/index.js). That
        # matters because Emscripten's cache has its own internal "sanity"
        # check that embeds the emsdk install path -- confirmed via a real CI
        # run where EM_CACHE was already being restored by actions/cache, yet
        # the build logged `shared:INFO: (Emscripten: config changed,
        # clearing cache)` and silently rebuilt everything anyway, because
        # the path baked into the cached sanity record didn't match that
        # run's fresh random temp path. Every run burned the same ~120s
        # regardless of the cache restore succeeding. A stable install path
        # fixes the sanity check, which is what actually lets the cache do
        # anything.
        uses: actions/cache@v4
        with:
          path: ${{ env.EMSDK_CACHE_FOLDER }}
          key: emsdk-${{ env.EM_VERSION }}-${{ hashFiles('rust/.cargo/config.toml') }}

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EM_VERSION }}
          actions-cache-folder: ${{ env.EMSDK_CACHE_FOLDER }}

      - uses: dtolnay/rust-toolchain@master
        with:
          # The Rust wasm32-unknown-emscripten target needs build-std, which is
          # nightly-only. This is the one place the project is not on stable.
          #
          # Pinned, not floating @nightly: rustc's own options.rs (checked via
          # `gh api repos/rust-lang/rust/pulls/147224/files`) shows
          # `emscripten_wasm_eh` flipped its DEFAULT from false to true on
          # 2025-12-05 (PR#147224, "Emscripten: Turn wasm-eh on by default"),
          # and by whatever nightly this project floats to today the whole
          # `-Z emscripten-wasm-eh` flag is gone outright -- confirmed by CI
          # itself failing with `error: unknown unstable option:
          # 'emscripten-wasm-eh'`, not just a changed default (that flag is
          # confirmed present, by fetching static.rust-lang.org's own dated
          # manifests, from whenever it was introduced through at least
          # 2026-05-01, gone by 2026-06-15).
          #
          # An EARLIER version of this pin used nightly-2025-11-15 (before the
          # default flip, relying on the OLD default instead of the flag) and
          # skipped the flag in rust/.cargo/config.toml entirely -- that broke
          # two ways at once, both caught only by actually trying the build,
          # not by reasoning about dates alone:
          #   1. godot 0.5.5's own MSRV is rustc 1.94; nightly-2025-11-15 is
          #      1.93.0. `cargo build` for the NATIVE step refused outright:
          #      "rustc 1.93.0-nightly is not supported by ... godot@0.5.5".
          #      Checked against static.rust-lang.org's dated channel
          #      manifests: the nightly version number only bumps to 1.94 on
          #      2025-12-06 -- the SAME DAY as the wasm-eh default flip, so
          #      there is no date at all where "before the flip" and "meets
          #      the MSRV" both hold. Pinning by date pre-flip is a dead end.
          #   2. Cargo also refused `--crate-type cdylib` on some (not all)
          #      dates even once rustc was new enough -- e.g. 2026-02-01
          #      dropped it outright ("dropping unsupported crate type
          #      cdylib for target wasm32-unknown-emscripten") where
          #      2025-12-10, 2026-01-01, 2026-03-01 through 2026-06-01 did
          #      not; some specific nightlies regress this target
          #      independent of the exception-ABI question entirely.
          #
          # nightly-2025-12-10 is the actual fix: past the MSRV bump, has
          # cdylib support, and the flag exists (rustc 1.94.0-nightly).
          # Verified for real, not just green CI: a full local build (with a
          # real emsdk 4.0.11, matching EM_VERSION) through this exact
          # toolchain + `-Z emscripten-wasm-eh=false` (rust/.cargo/config.toml)
          # produces a shared-memory import (`env.memory ... shared`, the
          # threading requirement) and legacy JS-based exception plumbing
          # (`env.invoke_*`, `env.__cxa_throw`, `env.__cxa_begin/end_catch`)
          # -- inspected directly with wasm-objdump -x on the built
          # angelbeach.wasm, with zero `Tag[]` entries and no
          # `__cpp_exception` import anywhere in the import table. That's the
          # exact shape Godot's official (JS-lowering) web templates need.
          #
          # Installed but NOT relied on as the rustup default (this action
          # sets whatever it installs as default, and installing it here,
          # first, means the `stable` step right below overrides that) --
          # the wasm build step addresses it explicitly by name
          # (`cargo +nightly-2025-12-10`) regardless of which is default.
          toolchain: nightly-2025-12-10
          targets: wasm32-unknown-emscripten
          components: rust-src

      - uses: dtolnay/rust-toolchain@stable
        # Installed SECOND so it -- not the pinned nightly above -- is the
        # rustup default, since "Build the native core for the editor" below
        # has no `+toolchain` of its own and needs godot 0.5.5's MSRV
        # (rustc 1.94).

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install Xvfb
        # Even --headless touches editor-only code paths (icon/theme loading)
        # that need a display server on Linux, or the editor binary aborts
        # (SIGABRT, no error message) partway through --import. Godot itself
        # never draws anything; this just satisfies that expectation.
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Build the native core for the editor
        # The Import and Export steps below run Godot's own editor binary
        # (linux, not wasm) to drive the tooling. It loads the GDExtension
        # too -- via the linux.debug.x86_64 slot -- so scripts referencing
        # native classes (MotionPlan, Contact, Tuning, ...) parse. Without
        # this the wasm build below is irrelevant: import fails first.
        run: ./build.sh

      - name: Build the native core for wasm
        working-directory: rust
        # The flags that make this a thread-compatible GDExtension side
        # module (SIDE_MODULE, +atomics, -pthread) live in
        # rust/.cargo/config.toml, target-scoped to wasm32-unknown-emscripten
        # -- not here as CFLAGS/CXXFLAGS, which was an earlier attempt that
        # did not work: those only affect C/C++ sources compiled through
        # cc-rs, and this crate has none. See that file for why each flag is
        # there; see angelbeach.gdextension for the matching `.threads.` key
        # this output has to be registered under.
        #
        # EM_CACHE lives inside the same folder the step above caches (see
        # that step's comment for why the folder has to be at this fixed
        # path rather than emsdk's default location).
        run: |
          EM_CACHE="$GITHUB_WORKSPACE/$EMSDK_CACHE_FOLDER/sysroot-cache" cargo +nightly-2025-12-10 build --release \
            --target wasm32-unknown-emscripten -Zbuild-std
          mkdir -p ../bin
          cp target/wasm32-unknown-emscripten/release/angelbeach.wasm \
             ../bin/libangelbeach.wasm32.release.wasm

      - name: Cache Godot editor and export templates
        # Keyed on version only -- both are immutable per Godot release, and
        # this also cuts one more dependency on codeload/release-asset CDN
        # flakiness (already hit repeatedly this project's CI history) out of
        # the common case.
        uses: actions/cache@v4
        with:
          path: |
            godot-bin
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_VERSION }}

      - name: Fetch Godot and its export templates
        run: |
          BASE=Godot_v${GODOT_VERSION}-stable_linux.x86_64
          if [ ! -x "godot-bin/$BASE" ]; then
            mkdir -p godot-bin
            curl -fsSL -o godot.zip \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${BASE}.zip"
            unzip -q godot.zip -d godot-bin && chmod +x "godot-bin/$BASE"
          fi
          echo "GODOT=$PWD/godot-bin/$BASE" >> "$GITHUB_ENV"

          DEST="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ ! -d "$DEST" ]; then
            curl -fsSL -o templates.tpz \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            unzip -q templates.tpz
            mkdir -p "$DEST"
            mv templates/* "$DEST"
          fi

      - name: Import
        # Godot's own editor binary reliably SIGSEGVs a few seconds after
        # finishing this work -- confirmed with a gdb backtrace (the crash
        # address sits inside Godot's own .text, not our extension) and it
        # is NOT runner-image-specific: pinning ubuntu-22.04 didn't fix it,
        # and it reproduces locally too. See godotengine/godot#98062,
        # #99284, #89674 for the same shape of crash in the editor's
        # post-import idle/teardown path.
        #
        # The import artifacts are written to disk BEFORE the crash, every
        # time -- verified directly against the seeded match, which plays
        # byte-identical off a cache written by a run whose process then
        # crashed. So the crash costs nothing this project depends on, and
        # gating on ITS exit code was the actual bug. Gate on the cache
        # instead.
        run: |
          xvfb-run --auto-servernum $GODOT --headless --import --path . || true
          test -s .godot/global_script_class_cache.cfg

      - name: Export Web
        # Same crash class as Import can in principle land here too, after
        # the export has already been written -- so this doesn't gate on the
        # export command's own exit code either. What actually proves
        # success is the output: an export that "succeeds" while dropping
        # the extension is the other failure mode worth catching, so assert
        # the wasm side is really there, not just index.html.
        run: |
          mkdir -p build/web
          xvfb-run --auto-servernum $GODOT --headless --path . --export-release "Web" build/web/index.html > export.log 2>&1 || true
          cat export.log
          test -f build/web/index.html
          ls build/web | grep -q '\.wasm$'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
