# Web build, deployed to GitHub Pages.
#
# THE ONE THING THAT WILL BREAK THIS: EM_VERSION below must match the Emscripten
# version Godot's own web export templates were built with. A GDExtension is
# linked against those templates, so a mismatch fails at load with the scene's
# classes all unknown rather than with a clear error. Godot pins it in
# .github/workflows/web_builds.yml on the matching release tag -- read it there
# and set it here; do not guess.
name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.1
  EM_VERSION: 4.0.14

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EM_VERSION }}

      - uses: dtolnay/rust-toolchain@nightly
        with:
          # The Rust wasm32-unknown-emscripten target needs build-std, which is
          # nightly-only. This is the one place the project is not on stable.
          targets: wasm32-unknown-emscripten
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install Xvfb
        # Even --headless touches editor-only code paths (icon/theme loading)
        # that need a display server on Linux, or the editor binary aborts
        # (SIGABRT, no error message) partway through --import. Godot itself
        # never draws anything; this just satisfies that expectation.
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Build the native core for the editor
        # The Import and Export steps below run Godot's own editor binary
        # (linux, not wasm) to drive the tooling. It loads the GDExtension
        # too -- via the linux.debug.x86_64 slot -- so scripts referencing
        # native classes (MotionPlan, Contact, Tuning, ...) parse. Without
        # this the wasm build below is irrelevant: import fails first.
        run: ./build.sh

      - name: Build the native core for wasm
        working-directory: rust
        env:
          # Godot's web templates are threaded, so the extension must be too, and
          # both sides must agree on the memory model or the module will not
          # instantiate.
          CFLAGS: -pthread
          CXXFLAGS: -pthread
        run: |
          cargo +nightly build --release --target wasm32-unknown-emscripten \
            -Zbuild-std
          mkdir -p ../bin
          cp target/wasm32-unknown-emscripten/release/angelbeach.wasm \
             ../bin/libangelbeach.wasm32.release.wasm

      - name: Fetch Godot and its export templates
        run: |
          BASE=Godot_v${GODOT_VERSION}-stable_linux.x86_64
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${BASE}.zip"
          unzip -q godot.zip && chmod +x "$BASE"
          echo "GODOT=$PWD/$BASE" >> "$GITHUB_ENV"
          curl -fsSL -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz
          DEST="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$DEST"
          mv templates/* "$DEST"

      - name: Import
        # Godot's own editor binary reliably SIGSEGVs a few seconds after
        # finishing this work -- confirmed with a gdb backtrace (the crash
        # address sits inside Godot's own .text, not our extension) and it
        # is NOT runner-image-specific: pinning ubuntu-22.04 didn't fix it,
        # and it reproduces locally too. See godotengine/godot#98062,
        # #99284, #89674 for the same shape of crash in the editor's
        # post-import idle/teardown path.
        #
        # The import artifacts are written to disk BEFORE the crash, every
        # time -- verified directly against the seeded match, which plays
        # byte-identical off a cache written by a run whose process then
        # crashed. So the crash costs nothing this project depends on, and
        # gating on ITS exit code was the actual bug. Gate on the cache
        # instead.
        run: |
          xvfb-run --auto-servernum $GODOT --headless --import --path . || true
          test -s .godot/global_script_class_cache.cfg

      - name: Export Web
        # Same crash class as Import can in principle land here too, after
        # the export has already been written -- so this doesn't gate on the
        # export command's own exit code either. What actually proves
        # success is the output: an export that "succeeds" while dropping
        # the extension is the other failure mode worth catching, so assert
        # the wasm side is really there, not just index.html.
        run: |
          mkdir -p build/web
          xvfb-run --auto-servernum $GODOT --headless --path . --export-release "Web" build/web/index.html > export.log 2>&1 || true
          cat export.log
          test -f build/web/index.html
          ls build/web | grep -q '\.wasm$'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
