# The acceptance run, on every push. The project's whole verification story is
# one seeded headless match whose stdout is compared against the previous build,
# so CI's job is to make that run and fail loudly when it stops running at all.
name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  GODOT_VERSION: 4.7.1

jobs:
  acceptance:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install Xvfb
        # Even --headless touches editor-only code paths (icon/theme loading)
        # that need a display server on Linux, or the editor binary aborts
        # (SIGABRT, no error message) partway through --import. Godot itself
        # never draws anything; this just satisfies that expectation.
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Fetch Godot
        run: |
          BASE=Godot_v${GODOT_VERSION}-stable_linux.x86_64
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${BASE}.zip"
          unzip -q godot.zip
          chmod +x "$BASE"
          echo "GODOT=$PWD/$BASE" >> "$GITHUB_ENV"

      - name: Build the native core
        # Debug, not --release: the runs below are headless (no --export), so
        # Godot's GDExtension loader resolves the linux.debug.x86_64 slot
        # regardless of how the .so itself was compiled. [profile.dev] in
        # rust/Cargo.toml already keeps this fast enough for the sim.
        run: ./build.sh

      - name: Import
        # Godot's own editor binary reliably SIGSEGVs a few seconds after
        # finishing this work. Confirmed with a gdb backtrace (cf323e1, no
        # symbols against the stripped official binary, but the crash address
        # sits inside Godot's own .text -- not our extension, not a shared
        # lib) and pinning ubuntu-22.04 did NOT fix it (b34764c), so this is
        # an upstream editor bug, not a runner-image or code issue -- see
        # godotengine/godot#98062, #99284, #89674 for the same shape of crash
        # in the editor's post-import idle/teardown path.
        #
        # It reproduces locally too (not CI-only after all), and crucially:
        # the import artifacts are written to disk BEFORE the crash, every
        # time -- "reimport | DONE" and "loading_editor_layout | DONE" both
        # log first. Verified directly: after a crashing local run, the
        # seeded match still plays byte-identical to the established
        # baseline off the cache that got written. So the crash costs
        # nothing this project depends on, and gating on ITS exit code was
        # the actual bug -- the real check is that the cache landed.
        run: |
          xvfb-run --auto-servernum $GODOT --headless --import --path . || true
          test -s .godot/global_script_class_cache.cfg

      - name: Seeded acceptance run
        run: |
          set -o pipefail
          xvfb-run --auto-servernum $GODOT --headless --path . res://src/match/Match.tscn 2>&1 | tee run.log
          grep -q 'MATCH DONE' run.log
          # Any script error is a failure even when the run completes: a parse
          # error in the windowed half is invisible to the numbers, which is
          # exactly how a broken build survived several green runs.
          ! grep -qiE 'SCRIPT ERROR|Parse Error' run.log
          echo "contacts=$(grep -c CONTACT run.log) rallies=$(grep -c 'RALLY end' run.log)"

      - name: Spike 1 — movement budget PORTCHECK
        run: xvfb-run --auto-servernum $GODOT --headless --path . res://src/debug/Spike1.tscn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-log
          path: run.log
